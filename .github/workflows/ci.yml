# Same automated gates the harness Evaluator runs (A1-A7). Contract-scoped gates (A8-A12)
# and LLM checks run only inside a harness run; their evidence is in .harness/reviews/.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python .harness/scripts/run_checks.py --ci
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-checks
          path: .harness/output/checks.*
